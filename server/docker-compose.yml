services:
  oni:
    build: .
    restart: unless-stopped
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - TRUST_PROXY=1   # Caddy is the one proxy in front (README: Security)
    volumes:
      - ./data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [oni]
volumes:
  caddy_data:
